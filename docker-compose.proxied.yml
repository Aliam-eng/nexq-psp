# For servers that ALREADY have a reverse proxy (nginx/Apache/Caddy/Traefik) on
# 80/443. No Caddy here — the app is published only on 127.0.0.1:${WEB_PORT}, and
# your existing proxy forwards the domain to it (and handles TLS).
services:
  db:
    image: postgres:16-alpine
    container_name: nexq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexq_deposit
    volumes:
      - nexq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexq -d nexq_deposit"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: nexq-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUN_SEED: ${RUN_SEED}
      WHISH_BASE_URL: ${WHISH_BASE_URL:-}
      WHISH_CHANNEL: ${WHISH_CHANNEL:-}
      WHISH_SECRET: ${WHISH_SECRET:-}
      WHISH_WEBSITE_URL: ${WHISH_WEBSITE_URL:-}
      WHISH_USER_AGENT: ${WHISH_USER_AGENT:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000" # localhost only; your proxy reaches it

  cron:
    image: curlimages/curl:latest
    container_name: nexq-cron
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CRON_SECRET: ${CRON_SECRET}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-300}
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do curl -fsS -m 30 -X POST -H "x-cron-secret: $$CRON_SECRET" http://web:3000/api/sweep >/dev/null 2>&1 || true; sleep "$${SWEEP_INTERVAL:-300}"; done'

volumes:
  nexq_pgdata:
